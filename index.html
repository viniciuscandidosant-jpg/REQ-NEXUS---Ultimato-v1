  ${us.length?`<div class="tbl-wrap"><table class="tbl resp"><thead><tr><th>Usuário</th><th>Perfil</th><th>Setor</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>
  ${us.map(u=>{const eu=u.id===state.profile.id;return `<tr class="${u.ativo?'':'off'}"><td class="first"><div class="row"><div class="avatar">${esc(initials(u.nome))}</div><div style="min-width:0"><b>${esc(u.nome)}${eu?' <span class="bdg b-brand nodot">você</span>':''}</b><div class="tiny">${esc(u.email)}</div></div></div></td>
    <td data-l="Perfil">${ROLES[u.role]||u.role}</td><td data-l="Setor">${u.setor?SETORES[u.setor]:'—'}</td>
    <td data-l="Situação">${u.ativo?'<span class="bdg b-ok">Ativo</span>':'<span class="bdg b-bad">Inativo</span>'}</td>
    <td data-l="Último acesso" class="tiny" title="${fmtDT(u.ultimo_login)}">${fmtRel(u.ultimo_login)}</td>
    <td class="acts"><button class="btn ghost sm" onclick="openUsuario('${u.id}')">${ic('edit')}Editar</button><button class="btn ghost sm" onclick="senhaUsuario('${u.id}')">${ic('key')}Senha</button>${eu?'':`<button class="btn ${u.ativo?'danger':'success'} sm" onclick="statusUsuario('${u.id}',${!u.ativo},this)">${ic('power')}${u.ativo?'Inativar':'Ativar'}</button>`}</td></tr>`;}).join('')}
  </tbody></table></div>`:emptyBox('Nenhum usuário encontrado.','users')}</div>
  <div class="card card-b" style="margin-top:16px"><div class="row" style="align-items:flex-start;gap:14px">${ic('shield')}<div class="tiny" style="color:var(--ink-2)"><b style="color:var(--ink)">Como funcionam os perfis</b><br><b>ADM Geral</b>: tudo, inclusive catálogo, usuários, lixeira e auditoria. <b>Estoquista</b>: vê todas as requisições, separa, ajusta e confirma entregas, e vê o consumo. <b>Setor</b>: faz requisições só do próprio setor e acompanha os seus pedidos. Login inativo não consegue entrar nem acessar dados.</div></div></div>`;
};
function userForm(u){
  const r=u?.role||'setor';
  return `<div class="stack">
    <div class="fld"><label class="lbl">Nome</label><input class="inp" id="uN" value="${esc(u?.nome||'')}" placeholder="Ex.: Cozinha — Turno noite" autofocus></div>
    <div class="fld"><label class="lbl">E-mail de acesso</label><input class="inp" id="uE" type="email" value="${esc(u?.email||'')}" placeholder="nome@grupoilha.local"><span class="hint">Pode ser um e-mail interno (ex.: bar2@grupoilha.local); não precisa existir de verdade.</span></div>
    ${u?'':`<div class="fld"><label class="lbl">Senha inicial</label><input class="inp" id="uS" type="text" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>`}
    <div class="grid g2">
      <div class="fld"><label class="lbl">Perfil</label><select class="inp" id="uR">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${r===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="fld" id="uSetWrap"><label class="lbl">Setor</label><select class="inp" id="uT">${Object.entries(SETORES).map(([k,v])=>`<option value="${k}" ${u?.setor===k?'selected':''}>${v}</option>`).join('')}</select></div>
    </div></div>`;
}
function openUsuario(id){
  const u=id?state.users.find(x=>x.id===id):null;
  const m=openModal({size:'sm',title:u?'Editar login':'Novo login',sub:u?esc(u.email):'O login já nasce ativo e pronto para usar.',body:userForm(u),
    foot:`<button class="btn ghost" data-x>Cancelar</button><button class="btn primary" id="uOk">${u?'Salvar':'Criar login'}</button>`});
  const sync=()=>{m.el.querySelector('#uSetWrap').style.visibility=m.el.querySelector('#uR').value==='setor'?'visible':'hidden';};
  m.el.querySelector('#uR').onchange=sync;sync();
  m.el.querySelector('#uOk').onclick=e=>busy(e.currentTarget,async()=>{
    const role=m.el.querySelector('#uR').value;
    const body={nome:m.el.querySelector('#uN').value.trim(),email:m.el.querySelector('#uE').value.trim().toLowerCase(),role,setor:role==='setor'?m.el.querySelector('#uT').value:null};
    if(!body.nome||!body.email) return toast('Preencha nome e e-mail.','err');
    try{
      if(u) await adminFn({acao:'editar',user_id:u.id,...body});
      else{const s=m.el.querySelector('#uS').value; if(s.length<6) return toast('Senha com no mínimo 6 caracteres.','err'); await adminFn({acao:'criar',senha:s,...body});}
      m.close(true);toast(u?'Login atualizado':'Login criado','ok');
      if(u&&u.id===state.profile.id){state.profile={...state.profile,...body};buildShell();}
      await loadUsers();render();
    }catch(err){toast(errMsg(err),'err');}
  });
}
function senhaUsuario(id){
  const u=state.users.find(x=>x.id===id);
  const m=openModal({size:'sm',title:'Redefinir senha',sub:esc(u.nome+' · '+u.email),
    body:`<div class="fld"><label class="lbl">Nova senha</label><input class="inp" id="nsS" type="text" placeholder="Mínimo 6 caracteres" autocomplete="new-password" autofocus><span class="hint">Passe a nova senha para a pessoa. Ela vale a partir do próximo login.</span></div>`,
    foot:`<button class="btn ghost" data-x>Cancelar</button><button class="btn primary" id="nsOk">${ic('key')}Salvar senha</button>`});
  m.el.querySelector('#nsOk').onclick=e=>busy(e.currentTarget,async()=>{
    const s=m.el.querySelector('#nsS').value; if(s.length<6) return toast('Senha com no mínimo 6 caracteres.','err');
    try{await adminFn({acao:'senha',user_id:id,senha:s});m.close(true);toast('Senha redefinida','ok');}catch(err){toast(errMsg(err),'err');}
  });
}
async function statusUsuario(id,ativo,btn){
  const u=state.users.find(x=>x.id===id);
  if(!await ask({title:ativo?'Ativar login':'Inativar login',msg:ativo?`${esc(u.nome)} volta a conseguir entrar no NEXUS.`:`${esc(u.nome)} não vai conseguir entrar nem acessar dados. O histórico de requisições é mantido.`,ok:ativo?'Ativar':'Inativar',danger:!ativo})) return;
  try{await adminFn({acao:'status',user_id:id,ativo});toast(ativo?'Login ativado':'Login inativado','ok');await loadUsers();render();}catch(err){toast(errMsg(err),'err');}
}
Object.assign(window,{openUsuario,senhaUsuario,statusUsuario});

/* =====================================================================
   AUDITORIA (ADM)
   ===================================================================== */
const ACAO_L={criar:'Criou requisição',marcar_separando:'Marcou separando',confirmar_entrega:'Confirmou entrega',alterar_entrega:'Alterou entrega',cancelar:'Cancelou',reabrir:'Reabriu',mover_lixeira:'Moveu p/ lixeira',restaurar_lixeira:'Restaurou',excluir_definitivo:'Excluiu definitivo',criar_item:'Criou produto',editar_item:'Editou produto',ativar_item:'Ativou produto',inativar_item:'Inativou produto',excluir_item:'Excluiu produto',criar_categoria:'Criou categoria',ativar_categoria:'Ativou categoria',inativar_categoria:'Inativou categoria',renomear_categoria:'Renomeou categoria',excluir_categoria:'Excluiu categoria',criar_usuario:'Criou login',editar_usuario:'Editou login',redefinir_senha:'Redefiniu senha',ativar_usuario:'Ativou login',inativar_usuario:'Inativou login',bloquear_usuario:'Bloqueou login',desbloquear_usuario:'Desbloqueou login'};
VIEWS.auditoria=function(){
  const a=state.aud, q=norm(a.q);
  const tabs=`<div class="seg"><button class="${a.tab==='acoes'?'on':''}" onclick="state.aud.tab='acoes';render()">${ic('log')}Ações</button><button class="${a.tab==='acessos'?'on':''}" onclick="state.aud.tab='acessos';render()">${ic('out')}Acessos</button></div>`;
  let body;
  if(a.tab==='acoes'){
    const logs=state.audit.filter(l=>!q||norm((l.usuario_nome||'')+' '+(ACAO_L[l.acao]||l.acao)+' '+l.tabela+' '+(l.justificativa||'')).includes(q));
    body=logs.length?`<div class="tbl-wrap"><table class="tbl resp"><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Área</th><th>Justificativa</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="first tiny">${fmtDT(l.criado_em)}</td><td data-l="Usuário"><b>${esc(l.usuario_nome||'—')}</b> <span class="tiny">${esc(ROLES[l.usuario_role]||'')}</span></td><td data-l="Ação">${esc(ACAO_L[l.acao]||l.acao)}</td><td data-l="Área" class="tiny">${esc(l.tabela)}</td><td data-l="Justificativa">${esc(l.justificativa||'—')}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('Nenhum registro.','shield');
  }else{
    const logs=state.logins.filter(l=>!q||norm(l.email+' '+(l.perfil||'')+' '+(l.setor||'')).includes(q));
    body=logs.length?`<div class="tbl-wrap"><table class="tbl resp"><thead><tr><th>Quando</th><th>Login</th><th>Perfil</th><th>Setor</th><th>Dispositivo</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="first tiny">${fmtDT(l.criado_em)}</td><td data-l="Login"><b>${esc(l.email||'—')}</b></td><td data-l="Perfil">${esc(ROLES[l.perfil]||l.perfil||'—')}</td><td data-l="Setor">${l.setor?SETORES[l.setor]:'—'}</td><td data-l="Dispositivo" class="tiny">${/mobile|android|iphone/i.test(l.user_agent||'')?'Celular':'Computador'}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('Nenhum acesso registrado.','out');
  }
  return pageHead('Auditoria','Quem fez o quê, e quando',`<button class="btn ghost" onclick="routeLoad()">${ic('refresh')}Atualizar</button>`)+
    `<div style="margin-bottom:14px">${tabs}</div><div class="card"><div class="toolbar"><div class="inp-ic">${ic('search')}<input class="inp" data-k="aq" placeholder="Buscar usuário, ação, justificativa…" value="${esc(a.q)}" oninput="typed(()=>state.aud.q=this.value)"></div></div>${body}</div>
    <p class="tiny" style="margin-top:10px">Mostrando os registros mais recentes (até 400 ações e 300 acessos).</p>`;
};

/* =====================================================================
   INÍCIO
   ===================================================================== */
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await startSession(session); else renderLogin();
  sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>{
    if(ev==='SIGNED_OUT'||!sess){if(state.profile){resetState();renderLogin();}return;}
    if(ev==='SIGNED_IN'&&state.profile?.id!==sess.user.id){startSession(sess);return;}
    state.session=sess;
  },0);});
}
init().catch(e=>{console.error(e);renderLogin('Não foi possível conectar. Verifique a internet e recarregue.');});
</script>
